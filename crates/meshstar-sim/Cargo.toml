[package]
name = "meshstar-sim"
description = "Discrete-event simulator for MeshStar networks: link model, collisions, mobility, sleeping LEAF nodes, metrics, ZRP vs flooding comparison"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
meshstar-core = { path = "../meshstar-core" }
meshstar-protocols = { path = "../meshstar-protocols" }
hex = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
rand_core = { workspace = true }
rand_chacha = { workspace = true }
log = { workspace = true }
