[package]
name = "meshstar-esp32-sx1276"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "MeshStar node firmware for Heltec WiFi LoRa 32 V2 / TTGO LoRa32 (ESP32 + SX1276)"

[dependencies]
meshstar-core = { path = "../../crates/meshstar-core", default-features = false }
meshstar-protocols = { path = "../../crates/meshstar-protocols", default-features = false, features = ["meshcore", "meshtastic"] }
meshstar-radio-sx127x = { path = "../../crates/meshstar-radio-sx127x" }
esp-hal = { version = "0.23", features = ["esp32", "unstable"] }
esp-backtrace = { version = "0.15", features = ["esp32", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.13", features = ["esp32", "log"] }
esp-alloc = "0.6"
esp-storage = { version = "0.4", features = ["esp32"] }
embedded-storage = "0.3"
embedded-hal = "1.0"
embedded-hal-bus = "0.2"
heapless = "0.8"
log = "0.4"
rand_core = { version = "0.6", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
