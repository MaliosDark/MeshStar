[package]
name = "meshstar-core"
description = "MeshStar core: ZRP routing, Noise XX sessions, Ed25519 identity, LEAF/ANCHOR roles, store-and-forward (no_std)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["rand_core/std", "log/std", "serde/std", "serde_json"]
# Relay builds for parts without room for Ed25519 (see relay/mod.rs): full
# beacons are accepted without signature verification and no identity is
# kept. Never enable it for a full node.
tiny = []

[dependencies]
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand_core = { workspace = true }
rand_chacha = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, optional = true }
hex = { workspace = true }

[dev-dependencies]
rand_chacha = { workspace = true }
