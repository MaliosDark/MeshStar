name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets
      - name: Test (workspace)
        run: cargo test --workspace

  nostd:
    name: no_std core build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build core without default features
        run: cargo build -p meshstar-core --no-default-features

  fuzz-smoke:
    name: Fuzz smoke (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run every decoder target for a short burst
        working-directory: crates/meshstar-core
        run: |
          for t in $(cargo +nightly fuzz list); do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- -max_total_time=45 -rss_limit_mb=4096
            echo "::endgroup::"
          done
